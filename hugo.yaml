# Site config. Docs: https://github.com/adityatelange/hugo-PaperMod/wiki/Variables
#
# Anything identifying comes from the environment, not this file. Hugo maps
# HUGO_<KEY> to top-level keys and HUGO_PARAMS_<KEY> to params. Set these in
# Vercel (Settings > Environment Variables) and in local.env for `./dev.sh`:
#   HUGO_BASEURL           https://example.com/
#   HUGO_TITLE             site title (shown in the header and <title>)
#   HUGO_PARAMS_AUTHOR     byline on posts
#   HUGO_PARAMS_GITHUBURL  social icon; omit to hide
#   HUGO_PARAMS_XURL       social icon; omit to hide
#   HUGO_PARAMS_LINKEDINURL social icon; omit to hide
#   HUGO_PARAMS_REPLYONX   X handle without @ for the button under posts; omit to hide
baseURL: https://example.org/
title: Blog
languageCode: en-us
theme: PaperMod
timeZone: America/Los_Angeles

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

# Pagefind-free search: PaperMod uses fuse.js over this JSON index
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: Notes on systems, data, and whatever I happen to be musing about.
  author: ""
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  hideSummary: false
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true          # renders layouts/_partials/comments.html (the Reply on X button)
  replyOnX: ""           # X handle without @; empty hides the button. Set via HUGO_PARAMS_REPLYONX in Vercel.
  hidemeta: false

  homeInfoParams:
    Title: Hi.
    Content: Notes on systems, data, and whatever I happen to be musing about.

  # Social icons are built by layouts/_partials/social_icons.html from the
  # *Url params above; RSS is always shown.
  githubUrl: ""
  xUrl: ""
  linkedinUrl: ""

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true   # allow raw HTML in markdown
  highlight:
    noClasses: false
    lineNos: false
